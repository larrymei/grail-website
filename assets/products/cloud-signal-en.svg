<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
  <title id="title">Cloud signal control</title>
  <desc id="desc">Navigation trajectories feed a continuous cycle of flow reconstruction, pattern analysis, timing optimization, and evaluation.</desc>
  <rect width="480" height="340" rx="16" fill="#f6f8f9"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect x="130" y="20" width="220" height="42" rx="21" fill="#e5efec"/>
    <text x="240" y="46" fill="#0b5c52" font-size="15">Navigation trajectories</text>
    <path d="M240 62v26M180 122h120v104H180z" fill="none" stroke="#7fafa4" stroke-width="2"/>
    <path d="m287 117 8 5-8 5M305 205l-5 8-5-8M193 231l-8-5 8-5M175 143l5-8 5 8" fill="none" stroke="#0b5c52" stroke-width="2"/>
    <g fill="#fff" stroke="#d8e5e0" stroke-width="1.5">
      <rect x="24" y="88" width="190" height="70" rx="10"/>
      <rect x="266" y="88" width="190" height="70" rx="10"/>
      <rect x="266" y="192" width="190" height="70" rx="10"/>
      <rect x="24" y="192" width="190" height="70" rx="10"/>
    </g>
    <g fill="#0b5c52" font-size="16" font-weight="500">
      <text x="119" y="118">Reconstruct flows</text>
      <text x="361" y="118">Analyze patterns</text>
      <text x="361" y="222">Optimize timing</text>
      <text x="119" y="222">Evaluate results</text>
    </g>
    <g fill="#6c7782" font-size="13">
      <text x="119" y="139">Intersection demand</text>
      <text x="361" y="139">Daily traffic rhythms</text>
      <text x="361" y="243">Coordinated signal plans</text>
      <text x="119" y="243">Delay and stops</text>
    </g>
    <circle cx="240" cy="174" r="8" fill="#ddb15a"/>
    <text x="240" y="310" fill="#0b5c52" font-size="14" letter-spacing="1.5">A CONTINUOUS IMPROVEMENT CYCLE</text>
  </g>
</svg>
